<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Архив покупок</title>
    <meta name="theme-color" content="#fff8e8">
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main class="notebook">
        <section class="screen" aria-labelledby="archive-title">
            <header class="top">
                <h1 id="archive-title">Архив покупок</h1>
            </header>

            <nav class="archive-nav" aria-label="Навигация">
                <a class="secondary-button back-button" href="index.html">
                    ← К списку
                </a>
            </nav>

            <section class="archive-controls" aria-label="Фильтры архива">
                <label class="field archive-search-field" for="archive-search">
                    <span class="field-label">Поиск</span>
                    <input
                        id="archive-search"
                        type="search"
                        placeholder="найти продукт"
                        autocomplete="off"
                    >
                </label>

                <label class="field archive-sort-field" for="archive-sort">
                    <span class="field-label">Сортировка</span>
                    <select id="archive-sort">
                        <option value="newest">сначала новые</option>
                        <option value="oldest">сначала старые</option>
                        <option value="expensive">сначала дорогие</option>
                    </select>
                </label>
            </section>

            <div class="archive-stats" id="archive-stats"></div>

            <section class="archive-list" id="archive-list" aria-label="Архив покупок"></section>
        </section>
    </main>
</body>
</html>
