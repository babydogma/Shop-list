<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#5b7cfa">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Архив покупок">
  <title>Архив покупок</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app-shell" data-screen="archive">
    <header class="archive-topbar">
      <a class="round-back" href="index.html" aria-label="Назад">←</a>

      <div class="search-wrap">
        <input id="search" type="search" placeholder="Поиск" aria-label="Поиск по архиву">
      </div>
    </header>

    <section class="filter-row" aria-label="Фильтр архива">
      <button class="filter-chip active" data-sort="new">Новые</button>
      <button class="filter-chip" data-sort="old">Старые</button>
      <button class="filter-chip" data-sort="sum">По сумме</button>
    </section>

    <section class="stats-card" aria-label="Статистика архива">
      <div>
        <span>Количество покупок</span>
        <strong id="archive-count">0</strong>
      </div>

      <div>
        <span>Всего потрачено</span>
        <strong id="archive-total">0 ₽</strong>
      </div>
    </section>

    <section class="archive-list-section">
      <div id="archive-list" class="archive-list"></div>

      <p id="archive-empty" class="empty-state">
        Архив пока пуст. Завершите покупки на главном экране.
      </p>
    </section>
  </main>

  <dialog id="archive-edit-dialog" class="edit-dialog archive-edit-dialog">
    <form id="archive-edit-form" class="card dialog-card" autocomplete="off">
      <div class="dialog-title-row">
        <h2>Редактировать покупку</h2>
        <button id="close-archive-edit" class="dialog-close" type="button" aria-label="Закрыть">×</button>
      </div>

      <input id="archive-edit-id" type="hidden">

      <label>
        <span>Дата покупки</span>
        <input id="archive-edit-date" type="date" required>
      </label>

      <div id="archive-edit-items" class="archive-edit-items"></div>

      <button id="archive-add-item" class="secondary-button add-archive-item" type="button">
        + Добавить товар в чек
      </button>

      <div class="dialog-actions sticky-dialog-actions">
        <button id="cancel-archive-edit" class="secondary-button" type="button">Отмена</button>
        <button class="primary-button" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>

  <dialog id="custom-store-dialog" class="edit-dialog small-dialog">
    <form id="custom-store-form" class="card dialog-card" autocomplete="off">
      <h2>Новый магазин</h2>

      <label>
        <span>Название магазина</span>
        <input id="custom-store-name" type="text" inputmode="text" placeholder="Например, Ашан" required maxlength="60">
      </label>

      <div class="dialog-actions">
        <button id="cancel-custom-store" class="secondary-button" type="button">Отмена</button>
        <button class="primary-button" type="submit">Добавить</button>
      </div>
    </form>
  </dialog>

  <script src="script.js" defer></script>
</body>
</html>
